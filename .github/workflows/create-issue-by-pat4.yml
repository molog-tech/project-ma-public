name: Universal Sync Discussion to Issue (Fixed Duplicate)
on:
  discussion:
    types: [created, edited, labeled, unlabeled]

concurrency:
  # บังคับให้รันทีละ 1 Job ต่อ 1 Discussion เท่านั้น
  group: sync-discussion-${{ github.event.discussion.id }}
  cancel-in-progress: false

jobs:
  sync_to_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Process Discussion
        if: github.event.discussion.category.name == 'Bug Report'
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TARGET_REPO: "molog-tech/molog-ewm-v2-issues"
        run: |
          # 1. ป้องกันเครื่องรันพร้อมกันแบบเสี้ยววินาที
          sleep $(( (RANDOM % 3) + 2 ))

          # 2. ดึงข้อมูลล่าสุดผ่าน API (ตรวจสอบความเป็นจริงปัจจุบัน)
          LATEST_DATA=$(curl -s -H "Authorization: token $PAT" \
            https://api.github.com/repos/${{ github.repository }}/discussions/${{ github.event.discussion.number }})
          
          LATEST_BODY=$(echo "$LATEST_DATA" | jq -r '.body')
          LATEST_LABELS_JSON=$(echo "$LATEST_DATA" | jq -c '.labels')
          TITLE=$(echo "$LATEST_DATA" | jq -r '.title')

          # 3. เตรียม Labels ที่ต้องการ Sync
          SELECTED_LABELS=$(echo "$LATEST_LABELS_JSON" | jq -c '[
            .[] | .name | select(startswith("ความถี่ในการใช้งาน") or startswith("ผลกระทบ"))
          ] + ["discussion"]')

          # 4. ค้นหา Issue URL จาก Body (ใช้ Regex ที่แม่นยำขึ้น)
          ALREADY_CREATED_URL=$(echo "$LATEST_BODY" | grep -o "https://github.com/$TARGET_REPO/issues/[0-9]*" | head -n 1 || true)

          echo "🔍 Check Result: URL Found -> '$ALREADY_CREATED_URL'"

          if [ -z "$ALREADY_CREATED_URL" ]; then
            # --- CASE: ยังไม่มี Issue ใน Body (สร้างใหม่) ---
            echo "🚀 No link found in body. Creating New Issue..."
            
            ISSUE_BODY="🔗 **Discussion Link:** ${{ github.event.discussion.html_url }}\n\n$LATEST_BODY"
            PAYLOAD=$(jq -n --arg title "$TITLE" --arg body "$ISSUE_BODY" --argjson labels "$SELECTED_LABELS" \
              '{title: $title, body: $body, labels: $labels}')

            NEW_ISSUE_RESP=$(curl -s -X POST -H "Authorization: token $PAT" \
                 -H "Accept: application/vnd.github.v3+json" \
                 https://api.github.com/repos/$TARGET_REPO/issues \
                 -d "$PAYLOAD")
            
            NEW_ISSUE_URL=$(echo "$NEW_ISSUE_RESP" | jq -r '.html_url')

            # --- จุดตัดสินใจ: ต้องอัปเดต Body ของ Discussion ทันทีเพื่อล็อก ---
            NEW_BODY="$LATEST_BODY\n\n---\n📌 **Synced to Issue:** $NEW_ISSUE_URL"
            curl -s -X PATCH -H "Authorization: token $PAT" \
                 -H "Accept: application/vnd.github.v3+json" \
                 https://api.github.com/repos/${{ github.repository }}/discussions/${{ github.event.discussion.number }} \
                 -d "$(jq -n --arg b "$NEW_BODY" '{body: $b}')" > /dev/null
            
            echo "🏁 Created and Locked: $NEW_ISSUE_URL"

          else
            # --- CASE: มี Link ใน Body แล้ว (อัปเดตตัวเดิม) ---
            echo "🔄 Issue already exists at $ALREADY_CREATED_URL. Updating labels only..."
            ISSUE_NUMBER=$(echo "$ALREADY_CREATED_URL" | grep -oE "[0-9]+$")
            
            curl -s -X PATCH -H "Authorization: token $PAT" \
                 -H "Accept: application/vnd.github.v3+json" \
                 https://api.github.com/repos/$TARGET_REPO/issues/$ISSUE_NUMBER \
                 -d "$(jq -n --arg t "$TITLE" --argjson l "$SELECTED_LABELS" '{title: $t, labels: $l}')" > /dev/null
            
            echo "🏁 Updated labels for Issue #$ISSUE_NUMBER"
          fi
