name: Sync Discussion to Issue (Strict Validation)
on:
  discussion:
    types: [created, edited, labeled, unlabeled]

jobs:
  sync_to_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Process Discussion to Issue
        if: github.event.discussion.category.name == 'Bug Report'
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TARGET_REPO: "molog-tech/molog-ewm-v2-issues"
        run: |
          # 1. ดึง Labels ทั้งหมดมานับจำนวนตัวที่ตรงเงื่อนไข
          ALL_LABELS_JSON='${{ toJson(github.event.discussion.labels) }}'
          
          # นับว่ามี Label ที่ขึ้นต้นด้วย "ความถี่ในการใช้งาน" กี่ตัว
          FREQ_COUNT=$(echo "$ALL_LABELS_JSON" | jq '[.[] | select(.name | startswith("ความถี่ในการใช้งาน"))] | length')
          
          # นับว่ามี Label ที่ขึ้นต้นด้วย "ผลกระทบ" กี่ตัว
          IMPACT_COUNT=$(echo "$ALL_LABELS_JSON" | jq '[.[] | select(.name | startswith("ผลกระทบ"))] | length')
          
          # 2. ตรวจสอบว่าเคยสร้างไปหรือยัง (กันสร้างซ้ำ)
          ALREADY_CREATED=$(echo "${{ github.event.discussion.body }}" | grep -c "$TARGET_REPO/issues/" || true)

          echo "📊 Status Summary:"
          echo "   - Frequency Labels found: $FREQ_COUNT"
          echo "   - Impact Labels found: $IMPACT_COUNT"
          echo "   - Already Created: $ALREADY_CREATED"

          # 3. เงื่อนไขเหล็ก: ต้องมีอย่างน้อยกลุ่มละ 1 อัน และยังไม่เคยสร้าง
          if [ "$FREQ_COUNT" -gt 0 ] && [ "$IMPACT_COUNT" -gt 0 ] && [ "$ALREADY_CREATED" -eq 0 ]; then
            echo "✅ All conditions met. Creating Issue..."

            # กรองเอาเฉพาะ Labels ที่เราต้องการส่งไปปลายทาง
            SELECTED_LABELS=$(echo "$ALL_LABELS_JSON" | jq -c '[
              .[] | .name | select(
                startswith("ความถี่ในการใช้งาน") or 
                startswith("ผลกระทบ")
              )
            ] + ["discussion"]')

            TITLE="${{ github.event.discussion.title }}"
            BODY="🔗 **Discussion Link:** ${{ github.event.discussion.html_url }}\n\n${{ github.event.discussion.body }}"
            
            PAYLOAD=$(jq -n \
              --arg title "$TITLE" \
              --arg body "$BODY" \
              --argjson labels "$SELECTED_LABELS" \
              '{title: $title, body: $body, labels: $labels}')

            RESPONSE=$(curl -s -X POST -H "Authorization: token $PAT" \
                 -H "Accept: application/vnd.github.v3+json" \
                 -H "Content-Type: application/json" \
                 https://api.github.com/repos/$TARGET_REPO/issues \
                 -d "$PAYLOAD")
            
            ISSUE_URL=$(echo "$RESPONSE" | jq -r '.html_url')
            echo "🚀 Success! Issue created at: $ISSUE_URL"
          
          else
            echo "⚠️ Validation Failed:"
            [ "$FREQ_COUNT" -eq 0 ] && echo "   - Missing 'ความถี่ในการใช้งาน' label"
            [ "$IMPACT_COUNT" -eq 0 ] && echo "   - Missing 'ผลกระทบ' label"
            [ "$ALREADY_CREATED" -ne 0 ] && echo "   - Issue already exists"
            exit 0
          fi
