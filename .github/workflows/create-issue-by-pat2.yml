name: Sync Discussion to Issue (Strict Sequence Fix)
on:
  discussion:
    types: [labeled] # ใช้เฉพาะตอนแปะ label เท่านั้นเพื่อลด race condition

concurrency:
  group: sync-discussion-${{ github.event.discussion.id }}
  cancel-in-progress: false

jobs:
  sync_to_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Process Discussion
        if: github.event.discussion.category.name == 'Bug Report'
        env:
          PAT: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          TARGET_REPO: "molog-tech/molog-ewm-v2-issues"
        run: |
          # 1. ป้องกันการทำงานซ้ำซ้อนด้วยการรอ (Jitter) เล็กน้อย
          # เพื่อให้เครื่องที่รันพร้อมกันมีลำดับก่อนหลังที่ชัดเจนขึ้น
          sleep $(( (RANDOM % 5) + 1 ))

          # 2. ดึงข้อมูลล่าสุด (Single Source of Truth)
          LATEST_DISCUSSION=$(curl -s -H "Authorization: token $PAT" \
            https://api.github.com/repos/${{ github.repository }}/discussions/${{ github.event.discussion.number }})
          
          LATEST_BODY=$(echo "$LATEST_DISCUSSION" | jq -r '.body')
          LATEST_LABELS_JSON=$(echo "$LATEST_DISCUSSION" | jq -c '.labels')

          # 3. ตรวจสอบเงื่อนไข
          FREQ_LABEL=$(echo "$LATEST_LABELS_JSON" | jq -r '.[] | select(.name | startswith("ความถี่ในการใช้งาน")) | .name' | head -n 1)
          IMPACT_LABEL=$(echo "$LATEST_LABELS_JSON" | jq -r '.[] | select(.name | startswith("ผลกระทบ")) | .name' | head -n 1)
          ALREADY_CREATED=$(echo "$LATEST_BODY" | grep -c "$TARGET_REPO/issues/" || true)

          # --- LOGIC สำคัญ ---
          # เราจะรันเฉพาะเมื่อ Label ที่เพิ่งถูกแปะ (current event) คือหนึ่งในสองประเภทนี้
          # และต้องครบทั้งคู่ + ยังไม่เคยสร้าง
          CURRENT_LABEL="${{ github.event.label.name }}"
          
          echo "🔍 Current Label Triggered: $CURRENT_LABEL"
          echo "📊 Status -> Freq: $FREQ_LABEL, Impact: $IMPACT_LABEL, Created: $ALREADY_CREATED"

          if [[ -n "$FREQ_LABEL" ]] && [[ -n "$IMPACT_LABEL" ]] && [[ "$ALREADY_CREATED" -eq 0 ]]; then
            
            # ด่านสุดท้าย: เช็คว่า Label ที่รันอยู่ตอนนี้คือ 'ผลกระทบ' หรือไม่? 
            # (หรือจะใช้อันไหนก็ได้อันหนึ่งเป็นตัวตัดสินใจสุดท้าย เพื่อไม่ให้รันซ้ำ 2 รอบ)
            # ในที่นี้ผมใช้ 'ความถี่ในการใช้งาน' เป็นตัว Master Trigger
            if [[ "$CURRENT_LABEL" != "$FREQ_LABEL" ]]; then
               echo "⚠️ Secondary label detected. Skipping to let the Master label trigger handle it."
               exit 0
            fi

            echo "🚀 Condition Met! Creating Issue..."

            SELECTED_LABELS=$(echo "$LATEST_LABELS_JSON" | jq -c '[
              .[] | .name | select(startswith("ความถี่ในการใช้งาน") or startswith("ผลกระทบ"))
            ] + ["discussion"]')

            TITLE="${{ github.event.discussion.title }}"
            ISSUE_BODY="🔗 **Discussion Link:** ${{ github.event.discussion.html_url }}\n\n$LATEST_BODY"
            
            PAYLOAD=$(jq -n --arg title "$TITLE" --arg body "$ISSUE_BODY" --argjson labels "$SELECTED_LABELS" \
              '{title: $title, body: $body, labels: $labels}')

            NEW_ISSUE_RESP=$(curl -s -X POST -H "Authorization: token $PAT" \
                 -H "Accept: application/vnd.github.v3+json" \
                 -H "Content-Type: application/json" \
                 https://api.github.com/repos/$TARGET_REPO/issues \
                 -d "$PAYLOAD")
            
            NEW_ISSUE_URL=$(echo "$NEW_ISSUE_RESP" | jq -r '.html_url')

            # UPDATE BODY ทันทีเพื่อล็อก
            NEW_BODY="$LATEST_BODY\n\n---\n📌 **Synced to Issue:** $NEW_ISSUE_URL"
            
            curl -s -X PATCH -H "Authorization: token $PAT" \
                 -H "Accept: application/vnd.github.v3+json" \
                 https://api.github.com/repos/${{ github.repository }}/discussions/${{ github.event.discussion.number }} \
                 -d "$(jq -n --arg b "$NEW_BODY" '{body: $b}')" > /dev/null

            echo "🏁 Done: $NEW_ISSUE_URL"
          else
            echo "⚠️ Aborted: Data incomplete or already synced."
          fi
