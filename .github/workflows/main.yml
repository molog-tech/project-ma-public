name: Create Issue from Discussion
on:
  discussion:
    types: [created]

jobs:
  create_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Create Issue
        uses: peter-evans/create-issue-from-discussion@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          discussion-id: ${{ github.event.discussion.node_id }}
          issue-title: "[From Discussion] ${{ github.event.discussion.title }}"
          issue-body: |
            🔗 **This issue was created from a discussion.**
            👉 [View Discussion](${{ github.event.discussion.html_url }})
